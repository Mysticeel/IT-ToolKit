name: PowerShell Quality Checks

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Pester Tests
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Pester
        shell: pwsh
        run: |
          Install-Module Pester `
            -RequiredVersion 6.2.0 `
            -Scope CurrentUser `
            -Force `
            -SkipPublisherCheck

      - name: Run Pester tests
        shell: pwsh
        run: |
          Remove-Module Pester -Force -ErrorAction SilentlyContinue
          Import-Module Pester -RequiredVersion 6.2.0 -Force

          Invoke-Pester `
            -Path ./tests `
            -CI

  analyze:
    name: PSScriptAnalyzer
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer `
            -Scope CurrentUser `
            -Force

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          Import-Module PSScriptAnalyzer -Force

          if (-not (Test-Path ./PSScriptAnalyzerSettings.psd1)) {
              throw "PSScriptAnalyzerSettings.psd1 was not found in the repository root."
          }

          $results = Invoke-ScriptAnalyzer `
            -Path ./src `
            -Recurse `
            -Settings ./PSScriptAnalyzerSettings.psd1

          if ($results) {
              $results |
                  Format-Table `
                      RuleName,
                      Severity,
                      ScriptName,
                      Line,
                      Message `
                      -AutoSize

              throw "PSScriptAnalyzer found $($results.Count) issue(s)."
          }

          Write-Host "PSScriptAnalyzer completed successfully with no warnings or errors."