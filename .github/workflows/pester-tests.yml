
name: PowerShell Quality Checks

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Pester Tests
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Pester
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Install-Module Pester `
            -RequiredVersion 6.2.0 `
            -Scope CurrentUser `
            -Force `
            -SkipPublisherCheck `
            -ErrorAction Stop

      - name: Verify Pester version
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Import-Module Pester -RequiredVersion 6.2.0 -Force -ErrorAction Stop

          $version = (Get-Module Pester).Version.ToString()

          if ($version -ne '6.2.0') {
              throw "Unexpected Pester version: $version"
          }

          Write-Host "Pester version $version verified."

      - name: Run Pester tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Remove-Module Pester -Force -ErrorAction SilentlyContinue
          Import-Module Pester -RequiredVersion 6.2.0 -Force -ErrorAction Stop

          New-Item -ItemType Directory -Path ./test-results -Force | Out-Null

          $config = New-PesterConfiguration

          $config.Run.Path = './tests'
          $config.Run.Exit = $true
          $config.Output.Verbosity = 'Detailed'

          $config.TestResult.Enabled = $true
          $config.TestResult.OutputFormat = 'NUnitXml'
          $config.TestResult.OutputPath = './test-results/pester-results.xml'

          Invoke-Pester -Configuration $config

      - name: Upload Pester test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: pester-test-results
          path: test-results/pester-results.xml
          if-no-files-found: error
          retention-days: 14

  analyze:
    name: PSScriptAnalyzer
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Install-Module PSScriptAnalyzer `
            -RequiredVersion 1.25.0 `
            -Scope CurrentUser `
            -Force `
            -ErrorAction Stop

      - name: Verify PSScriptAnalyzer version
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Import-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Force -ErrorAction Stop

          $version = (Get-Module PSScriptAnalyzer).Version.ToString()

          if ($version -ne '1.25.0') {
              throw "Unexpected PSScriptAnalyzer version: $version"
          }

          Write-Host "PSScriptAnalyzer version $version verified."

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Import-Module PSScriptAnalyzer `
            -RequiredVersion 1.25.0 `
            -Force `
            -ErrorAction Stop

          if (-not (Test-Path ./PSScriptAnalyzerSettings.psd1)) {
              throw "PSScriptAnalyzerSettings.psd1 was not found in the repository root."
          }

          $results = Invoke-ScriptAnalyzer `
            -Path ./src `
            -Recurse `
            -Settings ./PSScriptAnalyzerSettings.psd1

          if ($results) {
              $results |
                  Format-Table `
                      RuleName,
                      Severity,
                      ScriptName,
                      Line,
                      Message `
                      -AutoSize

              throw "PSScriptAnalyzer found $($results.Count) issue(s)."
          }

          Write-Host "PSScriptAnalyzer completed successfully with no warnings or errors."
